<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>じゃんけんゲーム</title>
</head>

<body>

  <div><a href="/logout">ログアウト</a></div>

  <h1>じゃんけんゲーム</h1>

  <p th:if="${loginUser != null}">
    Hi <span th:text="${loginUser}"></span>
  </p>
  <p sec:authorize="isAuthenticated()">
    ログインユーザ：<span sec:authentication="name"></span>
  </p>

  <h2>エントリー</h2>
  <ul th:if="${users}">
    <li th:each="user : ${users}">
      <span th:text="${user.name}"></span>
    </li>
  </ul>

  <h2>あなたの手を選んでください</h2>

  <a th:href="@{/janken(hand='グー')}">グー</a>
  <br>
  <a th:href="@{/janken(hand='チョキ')}">チョキ</a>
  <br>
  <a th:href="@{/janken(hand='パー')}">パー</a>

  <div th:if="${myHand != null}">

    <h2>結果</h2>

    <p>
      あなたの手：
      <span th:text="${myHand}"></span>
    </p>

    <p>
      CPUの手：
      <span th:text="${cpuHand}"></span>
    </p>

    <p>
      結果：
      <span th:text="${result}"></span>
    </p>

  </div>

</body>

</html>
