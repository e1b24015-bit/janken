<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Match</title>
</head>

<body>
  <div><a href="/logout">ログアウト</a></div>

  <h1>Match</h1>

  <h2><span th:text="${loginUser}"></span> V.S. <span th:text="${opponent.name}"></span></h2>

  <h2>あなたの手を選んでください</h2>
  <p th:if="${opponent}">
    <a th:href="@{/fight(id=${opponent.id}, hand='グー')}">グー</a>
    <a th:href="@{/fight(id=${opponent.id}, hand='チョキ')}">チョキ</a>
    <a th:href="@{/fight(id=${opponent.id}, hand='パー')}">パー</a>
  </p>

  <div th:if="${myHand != null}">
    <h2>結果</h2>
    <p>あなたの手：<span th:text="${myHand}"></span></p>
    <p>相手の手：<span th:text="${cpuHand}"></span></p>
    <p>結果：<span th:text="${result}"></span></p>
  </div>

  <p><a href="/janken">もどる</a></p>
</body>

</html>
